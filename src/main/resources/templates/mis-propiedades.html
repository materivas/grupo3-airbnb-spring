<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Propiedades - Airbnb</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <style>
        body {
            font-family: "Inter", system-ui, sans-serif;
            background-color: #fafafa;
            color: #333;
            margin: 0;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 1rem 2rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        .logo {
            height: 36px;
        }

        .nav-link {
            margin-left: 1.5rem;
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: #FF385C;
        }

        /* Main */
        main {
            padding: 2rem 4rem;
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #222;
            margin-bottom: 1rem;
        }

        /* Buscar propiedades */
        .search-form {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.07);
            text-align: center;
        }

        .search-form h3 {
            margin-bottom: 1rem;
            color: #444;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        input[type="number"] {
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            width: 100%;
            max-width: 300px;
            font-size: 1rem;
        }

        .btn-submit {
            background-color: #FF385C;
            border: none;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.25s, transform 0.1s;
        }

        .btn-submit:hover {
            background-color: #e13053;
            transform: translateY(-2px);
        }

        /* Mis propiedades */
        .propiedades-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 1.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
        }

        .propiedades-header h2 {
            font-size: 1.3rem;
            color: #333;
            margin: 0;
        }

        .propiedades-header span {
            color: #888;
            font-weight: 500;
        }

        /* Cards */
        .propiedades-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .propiedad-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease;
        }

        .propiedad-card:hover {
            transform: translateY(-6px);
        }

        .propiedad-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .propiedad-content {
            padding: 1.25rem;
        }

        .propiedad-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: #222;
        }

        .propiedad-location {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 0.8rem;
        }

        .propiedad-details {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 0.8rem;
        }

        .propiedad-price {
            font-size: 1.1rem;
            font-weight: 600;
            color: #FF385C;
        }

        .card-actions {
            text-align: right;
            margin-top: 1rem;
        }

        .btn-outline {
            border: 1px solid #FF385C;
            background: transparent;
            color: #FF385C;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s;
            font-weight: 500;
        }

        .btn-outline:hover {
            background: #FF385C;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #777;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .empty-state h3 {
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body>
    <header class="navbar">
        <div class="navbar-left">
            <a th:href="@{/}">
                <img th:src="@{/images/logo.png}" alt="Logo Airbnb" class="logo">
            </a>
        </div>
        <div class="navbar-right">
            <a th:href="@{/publicar}" class="nav-link">Publicar Propiedad</a>
            <a th:href="@{/}" class="nav-link">Inicio</a>
        </div>
    </header>

    <main>
        <h1>Mis Propiedades</h1>

        <!-- Buscar por DNI -->
        <div th:if="${anfitrion == null}" class="search-form">
            <h3>Consultar mis propiedades</h3>
            <form th:action="@{/mis-propiedades}" method="get">
                <div class="form-group">
                    <input type="number" id="dni" name="anfitrion" required placeholder="Ingresa tu DNI" min="1000000"
                        max="99999999">
                </div>
                <button type="submit" class="btn-submit">Ver mis propiedades</button>
            </form>
        </div>

        <!-- Mostrar propiedades -->
        <div th:if="${anfitrion != null}">
            <div class="propiedades-header">
                <h2>Propiedades publicadas <span>(DNI: <span th:text="${anfitrion}"></span>)</span></h2>
                <a th:href="@{/publicar}" class="btn-submit">+ Nueva Propiedad</a>
            </div>

            <div th:if="${propiedades.isEmpty()}" class="empty-state">
                <h3>No tienes propiedades publicadas</h3>
                <p>Comienza publicando tu primera propiedad.</p>
                <a th:href="@{/publicar}" class="btn-submit">Publicar Propiedad</a>
            </div>

            <div th:unless="${propiedades.isEmpty()}" class="propiedades-container">
                <div th:each="propiedad : ${propiedades}" class="propiedad-card">
                    <img th:src="${propiedad.mainImageUrl != null} ? ${propiedad.mainImageUrl} : '/images/placeholder.jpg'"
                        alt="Imagen propiedad" class="propiedad-image" onerror="this.src='/images/placeholder.jpg'">

                    <div class="propiedad-content">
                        <h3 class="propiedad-title" th:text="${propiedad.titulo}"></h3>
                        <p class="propiedad-location" th:text="${propiedad.ubicacion}"></p>

                        <div class="propiedad-details">
                            <span>👥 <span th:text="${propiedad.huespedes}"></span> huéspedes</span>
                        </div>

                        <div class="propiedad-price">
                            <span th:text="${propiedad.moneda} + ' $' + ${propiedad.precioPorNoche}"></span> / noche
                        </div>

                        <div class="card-actions">
                            <a th:href="@{'/propiedad/' + ${propiedad.id}}" class="btn-outline">Ver Detalles</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
